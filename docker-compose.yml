services:
  mysql:
    image: mysql:8.0
    container_name: akb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_knowledge_blog
    ports:
      - "3307:3306"  # 宿主机 3307 → 容器 3306（避开本机 MySQL 占用的 3306）
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: akb-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: akb-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mysql-data:
  qdrant-data:
