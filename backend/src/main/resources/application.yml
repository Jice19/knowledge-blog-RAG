server:
  port: 8080

spring:
  application:
    name: ai-knowledge-blog
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_knowledge_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

jwt:
  # 生产环境务必修改此密钥（HS256 需至少 32 字节）
  secret: ai-knowledge-blog-jwt-secret-key-please-change-me-0123456789abcdef
  expire-hours: 2

logging:
  level:
    com.jice19.blog: debug
